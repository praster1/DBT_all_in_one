version: 2
models:
- name: fct_orders
  description: 현재 유효 주문 한 건. 인정 매출은 paid/shipped/delivered 상태 금액.
  columns:
  - name: order_id
    data_tests:
    - not_null
    - unique
  - name: customer_id
    data_tests:
    - not_null
  - name: recognized_cents
    data_tests:
    - not_null
- name: fct_order_lines
  columns:
  - name: item_id
    data_tests:
    - not_null
    - unique
